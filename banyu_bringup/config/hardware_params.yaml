# Hardware configuration for the physical BANYU AUV (usb_cam USB cameras & sensor overrides)

# Device paths are udev symlinks (tools/udev/99-banyu.rules); usb_cam 0.8 opens them fine.

# Front camera "H264 USB Camera" (32e4:9422, POR). MJPEG 640x480 at up to 30 fps.
front_camera:
  ros__parameters:
    video_device: "/dev/front_camera"
    pixel_format: "mjpeg2rgb"
    image_width: 640
    image_height: 480
    framerate: 30.0
    io_method: "mmap"
    # usb_cam otherwise sets brightness to 50.
    brightness: 100
    frame_id: "front_camera_optical_frame"
    camera_name: "front_camera"
    camera_info_url: "package://banyu_bringup/config/front_camera_info.yaml"

# Horus B / 2M WebCam (Task 2): 1920x1080 only, and MJPEG is required over USB 2.0
# (raw YUYV at 1080p arrives as solid green). 15 fps keeps decode + recording CPU down.
# See docs/horus_camera.md.
bottom_camera:
  ros__parameters:
    video_device: "/dev/bottom_camera"
    pixel_format: "mjpeg2rgb"
    image_width: 1920
    image_height: 1080
    framerate: 15.0
    io_method: "mmap"
    # usb_cam otherwise sets brightness to 50.
    brightness: 100
    frame_id: "bottom_camera_optical_frame"
    camera_name: "bottom_camera"
    camera_info_url: "package://banyu_bringup/config/bottom_camera_info.yaml"

# Physical AUV overrides (applied when use_sim == False): pool depths and the bottom-camera mounting for ring_tracker.
# The buoys come only from the USV (PipelineBuoys), never from here.
banyu_mission:
  ros__parameters:
    mission:
      # Real pool depths; task2_params.yaml keeps the sim world's 12.5 / 13.9.
      inspection_depth_m: 2.5
      repair_depth_m: 3.0

ring_tracker:
  ros__parameters:
    camera_height_m: 1.7
    camera_forward_m: 0.2
    camera_tilt_from_vertical_rad: 0.227
    camera_half_vfov_rad: 0.408

esp32_bridge_node:
  ros__parameters:
    port: "/dev/esp32_kill"
    baud: 115200

esp32_trigger_node:
  ros__parameters:
    port: "/dev/esp32_kill"
    baud: 115200
