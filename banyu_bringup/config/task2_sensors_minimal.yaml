# Task 2 sensor overlay for sensors:=minimal: bottom camera + Pixhawk (IMU, compass) + RTK GPS at the surface only.
# No depth sensor is used for any decision: ArduSub ALT_HOLD needs one, so under water the vehicle flies STABILIZE and
# the heave comes from the camera (descent until the pipe or a light is in view, then a standoff from the pipe's
# apparent width); the surface is proven by a GPS fix. mission.launch.py loads it after the params and tier files.
banyu_mission:
  ros__parameters:
    autonomy_mode: "GUIDED,STABILIZE"
    mission:
      underwater_mode: "STABILIZE"
      # A vertical dive with no depth hold only finds the pipe if it is below: the start buoy is 1.5-2.5 m beyond the pipe's end
      # (Gazebo frame: the pipe's start at the top edge of the image at the buoy). Dive 2 m inside the buoys.
      dive_offset_m: 2.0
banyu_vehicle_status:
  ros__parameters:
    autonomy_mode: "GUIDED,STABILIZE"
vehicle_execution_node:
  ros__parameters:
    control:
      autonomy_mode: "GUIDED,STABILIZE"
      use_pressure_depth: false
    camera_heave:
      enabled: true
      # STABILIZE: the heave stick is thrust, not a climb rate, and the same command moves the vehicle about 4 times faster than in
      # ALT_HOLD (0.56 m/s for 0.12 commanded). Gentler standoff gains, so it does not overshoot the pipe; the dive keeps the
      # default gain (a slower dive passed over the pipe while still too high to see it).
      kp: 0.12
      max_rate_mps: 0.08
    # STABILIZE dive (Gazebo ground truth): 0.15 commanded sank at about 1.2 m/s and passed the pipe's depth in 2 s, below the start buoy
    # where the pipe is not (it ends 1.5-2.5 m before the buoy). Sink slowly (0.05 -> about 0.25 m/s) and creep along the buoy line so
    # the camera sweeps the gap while the vehicle is low enough to see the pipe (about 3 m).
    camera_descent:
      rate_mps: 0.05
      max_time_s: 100.0
      surge_mps: 0.0
      lock_s: 0.5
    # The stick offset added to any heave command (deadzone_z_pwm 50, for the ALT_HOLD stick deadband) was itself a strong thrust in
    # STABILIZE: 0.05 commanded sank at 0.85 m/s. 31 = just past RC3_DZ (30), so small commands are small thrusts.
    rc_override:
      deadzone_z_pwm: 31
calibrated_depth_node:
  ros__parameters:
    depth_source: "gps_surface"
# Under water the Pixhawk has no position (no GPS, no DVL): ring positions are dead-reckoned from the last surface fix and
# the commanded velocity, and the ring order is the progress along the buoy-to-buoy line (no pipe map).
ring_tracker:
  ros__parameters:
    pose_source: "dead_reckoning"
    progress_axis: "buoy_line"
