# Task 2 tier overlay for tier:=disruptive. mission.launch.py loads it AFTER task2_params.yaml (a later file wins), so
# the launch argument sets the tier of every node that depends on it. A dict or -p override did not win.
banyu_mission:
  ros__parameters:
    mission:
      task2_tier: 4
uuv_comm_node:
  ros__parameters:
    survey:
      task2_tier: 4
survey_evidence_node:
  ros__parameters:
    tier: 4
resource_code_decoder:
  ros__parameters:
    tier: 4
