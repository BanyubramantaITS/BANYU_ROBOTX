# https://mavlink.io/en/services/manual_control.html#directional-control
banyu_teleop:
  ros__parameters:
    axis_x: 1 # Left stick vertical (surge)
    axis_y: 0 # Left stick horizontal (sway)
    axis_z: 4 # Right stick vertical (heave)
    axis_r: 3 # Right stick horizontal (yaw)
    axis_s: 7 # D-pad vertical: gain up (+1) / gain down (-1), trim pitch (shift)
    axis_t: 6 # D-pad horizontal: trim roll (shift)

    scale_x: 1000.0 # Normalized range [-1000, 1000] for MAVROS
    scale_y: 1000.0
    scale_z: 500.0 # For legacy reasons, ArduSub’s MANUAL_CONTROL support expects Z-axis values in range [0,1000], instead of the specification range [-1000,1000].
    scale_r: 1000.0

    button_arm: 9 # options button
    button_disarm: 8 # select button
    button_shift: 5 # R1 button: hold for trim mode (D-pad -> pitch/roll trim)
    button_mode_manual: 1 # circle button
    button_mode_althold: 3 # square button
    button_mode_stabilize: 2 # triangle button
