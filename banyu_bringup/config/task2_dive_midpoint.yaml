# Task 2 dive point overlay for dive_point:=midpoint, the default (launch_task2.sh --dive-point midpoint). The vehicle navigates to the
# middle of the start and end buoys (the pipe is surely below; both buoys are far away), dives facing the end buoy, acquires the
# pipe, backs up along it (stern toward the start buoy) to the pipe's start, then surveys forward over the whole pipe.
# mission.launch.py loads it after the sensors overlay; dive_point:=buoy loads nothing.
banyu_mission:
  ros__parameters:
    mission:
      dive_point: "midpoint"
pipeline_end_node:
  ros__parameters:
    require_rings_complete: true   # the sim fixture's end candidate counts only after the four rings
