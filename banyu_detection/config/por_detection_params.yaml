por_detection:
  ros__parameters:
    # Colour mode:
    #   "per_object" (default): separate HSV per target. Gate = yellow, marker = orange.
    #   "single": legacy one HSV range below, gate/marker split by aspect ratio.
    color_mode: "per_object"

    # Per-object HSV (OpenCV H: 0-179, S/V: 0-255). If h_min > h_max the hue
    # range wraps around 0 (use for red targets, e.g. h_min 170, h_max 10).
    # All of these can be changed live with sliders:
    #   ros2 run rqt_reconfigure rqt_reconfigure        (pick /por_detection)
    #   python3 tools/por_hsv_tuner.py                  (sliders + mask preview)
    # then save with: ros2 service call /por_detection/save_params std_srvs/srv/Trigger
    gate_h_min: 20
    gate_h_max: 35
    gate_s_min: 80
    gate_s_max: 255
    gate_v_min: 80
    gate_v_max: 255
    marker_h_min: 5
    marker_h_max: 18
    marker_s_min: 120
    marker_s_max: 255
    marker_v_min: 100
    marker_v_max: 255
    morph_kernel: 3 # mask opening kernel to remove speckle (0 = off)

    # Debug images (only rendered while subscribed):
    #   /banyu/detection/debug/annotated, mask_gate, mask_marker (+ /compressed)
    debug_rate_hz: 5.0
    debug_scale: 0.5

    # Single-mode HSV thresholds (color_mode: "single")
    h_min: 25
    h_max: 35
    s_min: 75
    s_max: 255
    v_min: 50
    v_max: 255

    # Detection Filters
    min_area: 300 # Minimum blob area (pixels)
    kernel_size: 5 # Gaussian blur kernel size (must be odd)
    edge_margin_px: 5 # Boundary margin to test for FOV edge contact [active]
    min_height_px: 10 # Minimum blob height (pixels) [active]
    min_width_px: 10 # Minimum blob width (pixels) [active]
    min_apparent_size: 0.001 # Minimum apparent size (area / image_area) [active]
    max_distance_m: 20.0 # Maximum detection distance (meters, 0 = no limit) [active]

    # Aspect Ratio Thresholds (multiplied by 100 for slider)
    # buoy: width/height <= buoy_aspect_max/100
    # gate: width/height >= gate_aspect_min/100
    buoy_aspect_max: 65 # Buoy max aspect ratio (65 = 0.65)
    gate_aspect_min: 85 # Gate min aspect ratio (85 = 0.85)

    # Object Reference Dimensions (meters) - for dual-dimension distance estimation
    buoy_reference_height_m: 1.5 # Real buoy height [active]
    buoy_reference_width_m: 0.3 # Real buoy diameter / width [active]
    gate_reference_height_m: 2.0 # Real gate height [active]
    gate_reference_width_m: 2.0 # Real gate outer width [active]

    # Camera & Fallback
    image_topic: "/front_camera/image_raw" # [active]
    use_compressed_image: false # Subscribe to <image_topic>/compressed; launch sets true on the real AUV [active]
    camera_info_topic: "/camera/camera_info" # [active]
    fallback_focal_length_px: 0.0 # Used if camera_info unavailable (0 = no distance) [active]

    # Detection Priority
    target_priority: "largest" # "largest", "gate", or "buoy" [active]

    # GUI (set true for interactive tuning with sliders)
    use_gui: false # [active]
