# SINGLE SOURCE OF TRUTH for banyu_teleop configuration and RC mapping.
# RC transmitter (TX16S) teleop: RC switch handling for the BANYU ROV.
# Thrust is driven natively by ArduSub via RCMAP; this node handles
# arm/disarm, flight-mode, the ESP32 kill switch, and mock auto/mission mode.
# Note: SF switch is unmapped. Pixhawk arm/disarm is unified with ESP32 kill switch on SB.
banyu_teleop:
  ros__parameters:
    rc_topic: "/mavros/rc/in"
    kill_switch_topic: "/banyu/hardware/kill_switch"
    override_topic: "/mavros/rc/override"
    setpoint_topic: "/mavros/setpoint_raw/local"
    state_topic: "/mavros/state"

    # Flight mode switch (SC = CH8 = index 7): 900=STABILIZE, 1500=MANUAL, 2000=ALT_HOLD.
    # Active only when SB is in Manual or Disarmed mode; rejected in Autonomous mode.
    mode_channel: 7

    # Kill switch & Unified Arm (SB = CH6 = index 5):
    # Published operational_mode (issue #15): 0 kill, 1 manual, 2 autonomous.
    # 900 (Up)   = autonomous(2), arms Pixhawk if not armed, locks out gimbals & flight mode changes.
    # 1500 (Mid) = manual(1), automatically arms Pixhawk, allows gimbals & SC flight mode changes.
    # 2000 (Down)= kill/disarmed(0), disarms both ESP32 kill switch and Pixhawk.
    kill_channel: 5

    # 3-position switch band thresholds (shared by mode and kill switches).
    switch_low_threshold: 1200.0
    switch_high_threshold: 1750.0

    # Deadband for detecting manual gimbal stick input around neutral (1500 PWM).
    gimbal_deadband: 50.0

    # ESP32 kill-switch indicator (indikator_banyu.ino): lines its0 manual / its1 auto /
    # its2 emergency, mapped from operational_mode and resent every indicator_resend_period_s.
    serial_port: "/dev/esp32_kill"   # udev symlink, tools/udev/99-banyu.rules
    serial_baud: 115200
    # The board reports its2 while its physical kill input is active: teleop then disarms and holds
    # kill until SB Down. Set false only for land tests with the kill input unwired.
    use_hardware_kill: true
    kill_report_timeout_s: 1.5     # no report for this long -> error log (kill not monitored)
    kill_report_grace_s: 0.3       # ignore reports this soon after a mode change
    indicator_resend_period_s: 1.0
    kill_switch_board_topic: "/banyu/hardware/kill_switch_board"

    # Mock ESP32 Auto/Mission Mode (land testing)
    enable_mock_auto: false   # land test only: SB Up spins all thrusters; never true for a mission
    mock_auto_flight_mode: "MANUAL"
    mock_auto_publish_rate_hz: 20.0
    mock_auto_forward_pwm: 1540
    mock_auto_throttle_pwm: 1540
    mock_auto_lateral_pwm: 1500
    mock_auto_yaw_pwm: 1500
    mock_auto_pitch_pwm: 1500
    mock_auto_roll_pwm: 1500
    mock_auto_linear_x: 0.1
    mock_auto_linear_z: 0.1

    # Stick channels (1-based) = Pixhawk RCMAP_*: right stick forward CH2 / lateral CH1,
    # left stick throttle CH3 / yaw CH4. Pitch and roll are unmapped (RCMAP_PITCH/ROLL 0).
    pitch_channel: 0
    roll_channel: 0
    throttle_channel: 3
    yaw_channel: 4
    forward_channel: 2
    lateral_channel: 1
