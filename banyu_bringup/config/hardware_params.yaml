# Hardware configuration for the physical BANYU AUV (usb_cam USB cameras & sensor overrides)

# Logitech C270 (POR). usb_cam needs the real /dev/videoX, not a /dev/v4l/by-id symlink.
front_camera:
  ros__parameters:
    video_device: "/dev/video0"
    pixel_format: "mjpeg2rgb"
    image_width: 640
    image_height: 480
    framerate: 30.0
    io_method: "mmap"
    # usb_cam otherwise sets brightness to 50.
    brightness: 100
    frame_id: "front_camera_optical_frame"
    camera_name: "front_camera"
    camera_info_url: "package://banyu_bringup/config/front_camera_info.yaml"

# Horus B / 2M WebCam (Task 2): 1920x1080 only, and MJPEG is required over USB 2.0
# (raw YUYV at 1080p arrives as solid green). 15 fps keeps decode + recording CPU down.
# See docs/horus_camera.md.
bottom_camera:
  ros__parameters:
    video_device: "/dev/video2"
    pixel_format: "mjpeg2rgb"
    image_width: 1920
    image_height: 1080
    framerate: 15.0
    io_method: "mmap"
    # usb_cam otherwise sets brightness to 50.
    brightness: 100
    frame_id: "bottom_camera_optical_frame"
    camera_name: "bottom_camera"
    camera_info_url: "package://banyu_bringup/config/bottom_camera_info.yaml"

# Physical AUV course coordinates & camera mounting overrides (applied when use_sim == False).
# Update start/target/end coordinates for the competition venue if USV PipelineBuoys is not used,
# and update ring_tracker camera geometry to match physical bottom-camera mounting on the sub.
banyu_mission:
  ros__parameters:
    mission:
      start_latitude: 33.810313
      start_longitude: -118.393866
      target_latitude: 33.810438
      target_longitude: -118.393392
      end_latitude: 33.810438
      end_longitude: -118.393272

ring_tracker:
  ros__parameters:
    camera_height_m: 1.7
    camera_forward_m: 0.2
    camera_tilt_from_vertical_rad: 0.227
    camera_half_vfov_rad: 0.408

esp32_bridge_node:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baud: 115200

esp32_trigger_node:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baud: 115200
