# Task 2 sensor overlay for sensors:=minimal: bottom camera + Pixhawk (IMU, compass) + RTK GPS at the surface only.
# No depth sensor is used for any decision: ArduSub ALT_HOLD needs one, so under water the vehicle flies STABILIZE and
# the heave comes from the camera (descent until the pipe or a light is in view, then a standoff from the pipe's
# apparent width); the surface is proven by a GPS fix. mission.launch.py loads it after the params and tier files.
banyu_mission:
  ros__parameters:
    autonomy_mode: "GUIDED,STABILIZE"
    mission:
      underwater_mode: "STABILIZE"
banyu_vehicle_status:
  ros__parameters:
    autonomy_mode: "GUIDED,STABILIZE"
vehicle_execution_node:
  ros__parameters:
    control:
      autonomy_mode: "GUIDED,STABILIZE"
      use_pressure_depth: false
      # STABILIZE: the heave stick is thrust, not a climb rate. With the ALT_HOLD gain (400 PWM per m/s) the vehicle sank about 4 times
      # faster than commanded (0.56 m/s for 0.12) and overshot the pipe; this gain makes a command match the real speed in the sim.
      # The offset matches RC3_DZ (30). Re-measure on the robot (its buoyancy and thrusters differ).
    rc_override:
      gain_z_pwm_per_mps: 120.0
      deadzone_z_pwm: 30
    camera_heave:
      enabled: true
    # With the STABILIZE gain a 0.15 m/s descent is about 48 PWM, too little against the buoyancy: the dive ran out of time near the
    # surface. 0.3 m/s (about 66 PWM) sinks steadily; it stops as soon as the pipe is in view.
    camera_descent:
      rate_mps: 0.3
      # The time limit is max_depth_m / rate_mps; the real sink in the sim is about 0.24 m/s for 0.3 commanded, so 25 gives 83 s
      # (about 20 m). With no depth sensor the time is the only bound on the dive.
      max_depth_m: 25.0
calibrated_depth_node:
  ros__parameters:
    depth_source: "gps_surface"
# Under water the Pixhawk has no position (no GPS, no DVL): ring positions are dead-reckoned from the last surface fix and
# the commanded velocity, and the ring order is the progress along the buoy-to-buoy line (no pipe map).
ring_tracker:
  ros__parameters:
    pose_source: "dead_reckoning"
    progress_axis: "buoy_line"
