# Very slow timed POR profile for the real AUV (thrusters 2 & 3 degraded, yaws right under thrust).
# Forward/back legs run at 0.12 m/s with durations scaled to keep the safe-profile distances;
# heading hold (vehicle_execution_node.timed_move.heading_hold) counters the drift.
banyu_mission:
  ros__parameters:
    mission_mode: "por"
    fallback_mode: "SURFACE"
    topics:
      pipeline_end_state: "/banyu/pipeline/end_state"
      run_lifecycle: "/banyu/mission/run_lifecycle"
      run_command: "/system/mission/command"
      readiness_pose: "/mavros/local_position/pose"
      execution_readiness: "/banyu/execution/readiness"
      survey_progress: "/banyu/communication/survey_progress"
    timing:
      preparation_timeout_s: 30.0
      execution_readiness_timeout_s: 1.0
      run_reset_timeout_s: 3.0
    run:
      reset_services:
        ["/banyu/pipeline/reset_tracker", "/banyu/pipeline/reset_end"]
    mission:
      task2_tier: 2
      surface_depth_m: 0.0
      surface_tolerance_m: 0.25
      # Continuous missing-prerequisite watchdog; not a fixed surface phase duration.
      surface_watchdog_timeout_s: 5.0
      gate_depth_m: 2.0
      gate_depth_tolerance_m: 0.3
      acquire_gate_timeout_s: 20.0
      gate_align_deadband_x: 0.03
      gate_align_deadband_y: 0.03
      gate_align_gain_x: 1.2
      gate_align_gain_y: 1.0
      gate_align_max_speed_y: 0.4
      gate_align_max_speed_z: 0.3
      gate_align_hold_time_s: 1.0
      gate_align_timeout_s: 20.0
      gate_pass_speed_mps: 0.8
      gate_pass_target_distance_m: 4.0
      gate_pass_minimum_distance_m: 0.8
      gate_pass_blind_duration_s: 8.0
      gate_pass_timeout_s: 20.0
      marker_search_speed_mps: 0.6
      marker_search_timeout_s: 45.0
      marker_align_deadband_x: 0.03
      marker_align_deadband_y: 0.03
      marker_align_gain_x: 1.2
      marker_align_gain_y: 1.0
      marker_align_max_speed_y: 0.6
      marker_align_max_speed_z: 0.6
      marker_align_minimum_distance_m: 1.0
      marker_align_standoff_min_m: 2.2
      marker_align_standoff_max_m: 2.5
      marker_align_hold_time_s: 1.0
      marker_align_timeout_s: 20.0
      orbit_speed_mps: 0.6
      orbit_radius_m: 2.5
      orbit_range_gain: 0.8
      orbit_max_range_speed_mps: 0.6
      orbit_yaw_gain: 1.5
      orbit_max_yaw_rate_rad_s: 0.6
      orbit_vertical_gain: 1.0
      orbit_max_vertical_speed_mps: 0.4
      orbit_angle_rad: 6.283185307
      orbit_timeout_s: 60.0
      turn_yaw_rate_rad_s: 0.6
      turn_capture_gain: 0.8
      turn_capture_deadband: 0.08
      turn_max_angle_rad: 3.141592653
      turn_timeout_s: 30.0
      gate_search_speed_mps: 0.6
      gate_search_timeout_s: 30.0
      return_gate_pass_speed_mps: 0.8
      return_gate_pass_target_distance_m: 10.5
      return_gate_pass_minimum_distance_m: 0.8
      return_gate_pass_blind_duration_s: 10.0
      return_gate_pass_timeout_s: 35.0

      # =======================================================================
      # SAFE strafe-box profile (sim-verified, ~87 s, gate back at ~75 s)
      # Yaw is never changed: the circle_turn_* slots are used as STRAFES.
      #   dive in place -> forward 0.6 m/s to ~2 m before pole
      #   turn_1: strafe right 2 m   forward_1: forward 3.5 m (pass pole)
      #   turn_2: strafe left 4 m    forward_2: backward 3.5 m
      #   turn_3: strafe right 2 m   (back on the centre line)
      #   return_to_gate: BACK UP through the gate at 0.6 m/s, then surface.
      # Sim tolerance: speed error +/-5%, start heading +/-5 deg, start
      # offset 0.5 m. Distance ~= speed * (duration - 0.55 s fwd / 0.85 s back).
      # See docs/por_timed_tuning.md for the stopwatch tuning procedure.
      # =======================================================================
      # -----------------------------------------------------------------------
      # Timed POR Strategy Parameters (used when use_vision is false)
      # - use_sensors: true  (default) -> uses Pixhawk Baro depth hold (use_baro_depth) & IMU yaw (use_imu_yaw_cap)
      # - use_sensors: false           -> 100% pure timer + speed/movement (ignores all sensors)
      # - Set any segment's *_duration_s to 0.0 to skip that segment.
      # Body-frame FLU convention:
      #   speed_x_mps: +forward / -backward
      #   speed_y_mps: +left / -right
      #   speed_z_mps: +up / -down (used when use_sensors or use_baro_depth is false)
      #   yaw_rate_rad_s: +counter-clockwise (left) / -clockwise (right)
      # -----------------------------------------------------------------------
      use_vision: false
      # true: timed outbound + loop, then camera TurnAround/SearchGate/AlignGate/PassGate
      # return (bt/por_hybrid_mission.xml); timed return_to_gate is the fallback.
      use_vision_return: false
      use_sensors: true   # pure timer: false (sim-verified, no other change)
      use_baro_depth: true
      use_imu_yaw_cap: true
      depth_kp: 0.7
      max_depth_speed_mps: 0.4

      # 1. Dive to center of gate depth
      dive_duration_s: 5.0
      dive_speed_x_mps: 0.0
      dive_speed_y_mps: 0.0
      dive_speed_z_mps: -0.4
      dive_yaw_rate_rad_s: 0.0

      # 2. Go forward to pass through the gate
      timed_pass_gate_duration_s: 30.0
      timed_pass_gate_speed_x_mps: 0.12
      timed_pass_gate_speed_y_mps: 0.0
      timed_pass_gate_speed_z_mps: 0.0
      timed_pass_gate_yaw_rate_rad_s: 0.0

      # 3. Go forward approaching the pole
      approach_pole_duration_s: 67.5
      approach_pole_speed_x_mps: 0.12
      approach_pole_speed_y_mps: 0.0
      approach_pole_speed_z_mps: 0.0
      approach_pole_yaw_rate_rad_s: 0.0

      # 4. Circle the pole (4-sided polygon: Turn 90 deg -> Forward x 4, default clockwise)
      # Step 1: Turn right (-90 deg) and move forward
      circle_turn_1_duration_s: 4.5
      circle_turn_1_speed_x_mps: 0.0
      circle_turn_1_speed_y_mps: -0.5
      circle_turn_1_speed_z_mps: 0.0
      circle_turn_1_yaw_rate_rad_s: 0.0
      circle_turn_1_target_angle_rad: 0.0
      circle_forward_1_duration_s: 30.0
      circle_forward_1_speed_x_mps: 0.12
      circle_forward_1_speed_y_mps: 0.0
      circle_forward_1_speed_z_mps: 0.0
      circle_forward_1_yaw_rate_rad_s: 0.0

      # Step 2: Turn left (+90 deg) and move forward past pole
      circle_turn_2_duration_s: 9.2
      circle_turn_2_speed_x_mps: 0.0
      circle_turn_2_speed_y_mps: 0.5
      circle_turn_2_speed_z_mps: 0.0
      circle_turn_2_yaw_rate_rad_s: 0.0
      circle_turn_2_target_angle_rad: 0.0
      circle_forward_2_duration_s: 34.6
      circle_forward_2_speed_x_mps: -0.12
      circle_forward_2_speed_y_mps: 0.0
      circle_forward_2_speed_z_mps: 0.0
      circle_forward_2_yaw_rate_rad_s: 0.0

      # Step 3: Turn left (+90 deg) and move forward behind pole
      circle_turn_3_duration_s: 4.5
      circle_turn_3_speed_x_mps: 0.0
      circle_turn_3_speed_y_mps: -0.5
      circle_turn_3_speed_z_mps: 0.0
      circle_turn_3_yaw_rate_rad_s: 0.0
      circle_turn_3_target_angle_rad: 0.0
      circle_forward_3_duration_s: 0.0
      circle_forward_3_speed_x_mps: 0.12
      circle_forward_3_speed_y_mps: 0.0
      circle_forward_3_speed_z_mps: 0.0
      circle_forward_3_yaw_rate_rad_s: 0.0

      # Step 4: Turn left (+90 deg) and move forward alongside pole
      circle_turn_4_duration_s: 0.0
      circle_turn_4_speed_x_mps: 0.0
      circle_turn_4_speed_y_mps: 0.0
      circle_turn_4_speed_z_mps: 0.0
      circle_turn_4_yaw_rate_rad_s: 0.6
      circle_turn_4_target_angle_rad: 1.570796327
      circle_forward_4_duration_s: 0.0
      circle_forward_4_speed_x_mps: 0.12
      circle_forward_4_speed_y_mps: 0.0
      circle_forward_4_speed_z_mps: 0.0
      circle_forward_4_yaw_rate_rad_s: 0.0

      # 5. Final turn to face the gate & go forward back to gate
      return_turn_duration_s: 0.0
      return_turn_speed_x_mps: 0.0
      return_turn_speed_y_mps: 0.0
      return_turn_speed_z_mps: 0.0
      return_turn_yaw_rate_rad_s: 0.6
      return_turn_target_angle_rad: 1.570796327
      return_to_gate_duration_s: 92.5
      return_to_gate_speed_x_mps: -0.12
      return_to_gate_speed_y_mps: 0.0
      return_to_gate_speed_z_mps: 0.0
      return_to_gate_yaw_rate_rad_s: 0.0

      # 6. Surface
      timed_surface_duration_s: 6.0
      timed_surface_speed_x_mps: 0.0
      timed_surface_speed_y_mps: 0.0
      timed_surface_speed_z_mps: 0.4
      timed_surface_yaw_rate_rad_s: 0.0
    actions:
      acquire_gate: "/banyu/actions/acquire_gate"
      search_marker: "/banyu/actions/search_marker"
      search_gate: "/banyu/actions/search_gate"
      align_gate: "/banyu/actions/align_gate"
      align_marker: "/banyu/actions/align_marker"
      pass_gate: "/banyu/actions/pass_gate"
      orbit_marker: "/banyu/actions/orbit_marker"
      turn_around: "/banyu/actions/turn_around"
      timed_move: "/banyu/actions/timed_move"
      surface: "/banyu/actions/surface"

por_detection:
  ros__parameters:
    target_priority: "largest"
    fallback_focal_length_px: 500.0
    buoy_reference_height_m: 1.5
    buoy_reference_width_m: 0.3
    gate_reference_height_m: 2.0
    gate_reference_width_m: 2.0
    edge_margin_px: 5
    min_height_px: 10
    min_width_px: 10
    image_topic: "/front_camera/image_raw"
    # Launch sets this true on the real AUV (use_sim:=False)
    use_compressed_image: false
    camera_info_topic: "/camera/camera_info"
    max_distance_m: 20.0
    use_gui: false

vehicle_execution_node:
  ros__parameters:
    timed_move:
      # Hard cap on horizontal (forward and lateral) speed in m/s; 0 disables
      max_horizontal_speed_mps: 0.12
      heading_hold:
        # Straight timed legs hold the heading from segment start (thruster 2/3 yaw drift)
        enabled: true
        kp: 1.0
        max_yaw_rate_rad_s: 0.3
        deadband_rad: 0.02
    control:
      require_calibrated_surface_depth: false
      surface_hold_time_s: 1.0
      surface_depth_timeout_s: 0.5
      surface_max_depth_m: 0.2
      require_run_authorization: false
      run_lifecycle_timeout_s: 1.0
      enable_mavros_publish: true
      publish_rate_hz: 20.0
      require_guided: true
      max_linear_speed: 1.2
      max_yaw_rate: 0.8
    surface:
      depth_sources: ["pressure_depth"]
    topics:
      water_depth: "/banyu/vehicle/water_depth"
      run_lifecycle: "/banyu/mission/run_lifecycle"
      execution_readiness: "/banyu/execution/readiness"
      status: "/banyu/vehicle_status"
      pose: "/mavros/local_position/pose"
      gps: "/mavros/global_position/raw/fix"
      detection: "/banyu/detection"
      preview_target: "/banyu/execution/preview_target"
      mavros_target: "/mavros/setpoint_raw/local"
    actions:
      surface: "/banyu/actions/surface"
      acquire_gate: "/banyu/actions/acquire_gate"
      search_marker: "/banyu/actions/search_marker"
      search_gate: "/banyu/actions/search_gate"
      align_gate: "/banyu/actions/align_gate"
      align_marker: "/banyu/actions/align_marker"
      pass_gate: "/banyu/actions/pass_gate"
      orbit_marker: "/banyu/actions/orbit_marker"
      turn_around: "/banyu/actions/turn_around"
      timed_move: "/banyu/actions/timed_move"

banyu_vehicle_status:
  ros__parameters:
    state_topic: "/mavros/state"
    rc_topic: "/mavros/rc/in"
    gps_topic: "/mavros/global_position/raw/fix"
    status_topic: "/banyu/vehicle_status"
    publish_rate_hz: 10.0
    fcu_timeout_s: 5.0
    rc_timeout_s: 3.0
    gps_timeout_s: 5.0
    rc_takeover_channel: 4
    rc_takeover_threshold: 1700
    autonomy_mode: "GUIDED"
    default_operational_mode: 0
    kill_switch_timeout_s: 1.0

esp32_bridge_node:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baud: 115200
    heartbeat_rate_hz: 10.0
    serial_timeout_s: 0.5

esp32_serial_node:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baud: 115200
    timer_period_s: 0.1
    append_newline: false
    default_trigger_cmd: "1"
    trigger_on_cmd: "1"
    trigger_off_cmd: "0"
    trigger_service: "/banyu/trigger/fire"
    set_trigger_service: "/banyu/trigger/set"
    command_service: "/banyu/trigger/command"
    command_topic: "/banyu/trigger/cmd"
    monitor_topic: "/banyu/trigger/monitor"

esp32_trigger_node:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baud: 115200
    timer_period_s: 0.1
    append_newline: false
    default_trigger_cmd: "1"
    trigger_on_cmd: "1"
    trigger_off_cmd: "0"
    trigger_service: "/banyu/trigger/fire"
    set_trigger_service: "/banyu/trigger/set"
    command_service: "/banyu/trigger/command"
    command_topic: "/banyu/trigger/cmd"
    monitor_topic: "/banyu/trigger/monitor"

sim_rc_deadman_node:
  ros__parameters:
    rc_topic: "/sim/supervisor_rc"
    publish_rate_hz: 10.0
    num_channels: 8
    channel_value: 1500

banyu_teleop:
  ros__parameters:
    rc_in:
      arm_channel: 4
      mode_channel: 6
      kill_channel: 5
      serial_port: "/dev/ttyUSB0"
      baud_rate: 115200
      kill_switch_topic: "/banyu/hardware/kill_switch"
    enable_mock_auto: true
    auto_arm_on_auto_mode: true
    mock_auto_flight_mode: "MANUAL"
    mock_auto_publish_rate_hz: 20.0
    mock_auto_forward_pwm: 1540
    mock_auto_throttle_pwm: 1540
    mock_auto_lateral_pwm: 1500
    mock_auto_yaw_pwm: 1500
    mock_auto_pitch_pwm: 1500
    mock_auto_roll_pwm: 1500

ekf_source_switch:
  ros__parameters:
    dive_depth: 0.5
    surface_depth: 0.2
    require_gps: true
